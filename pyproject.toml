# Mentera RAG Pipeline — project & tooling config.
# Production-grade, cloud-agnostic, multi-tenant RAG pipeline.
# Embeddings: AWS Bedrock, Azure OpenAI, GCP Vertex AI.
# Vector store: Qdrant (shared collection with tenant_id filtering).

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mentera_rag"]


[project]
name = "mentera-rag"
version = "1.0.0"
description = "Production-grade, cloud-agnostic, multi-tenant RAG pipeline serving retrieved context to downstream agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

dependencies = [
  # Orchestration — graph-native agentic retrieval
  "langchain-community>=0.3",
  "langgraph>=0.2",
  # Vector store — Qdrant only
  "qdrant-client>=1.12",
  # AWS — Bedrock embeddings (Titan, Cohere)
  "boto3>=1.35",
  # Azure OpenAI embeddings
  "openai>=1.40",
  # GCP Vertex AI embeddings
  "google-cloud-aiplatform>=1.60",
  # Sparse / lexical retrieval baseline
  "rank-bm25>=0.2.2",
  # Document parsing
  "pymupdf>=1.24",       # PDF extraction (fitz)
  "pillow>=10.0",        # Image handling for OCR
  # API
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.12",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  # Config, tracking, data
  "pyyaml>=6.0",
  "mlflow>=2.17",
  "pandas>=2.2",
  "numpy>=2.0",
]

[project.optional-dependencies]
# Tesseract OCR for image document parsing
ocr = [
  "pytesseract>=0.3.10",
]
# Cloud object storage backends
storage = [
  "azure-storage-blob>=12.20",
  "google-cloud-storage>=2.16",
]
# Retrieval-quality and RAG-answer evaluation libraries
eval = [
  "ranx>=0.3.20",
  "ragas>=0.2",
]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "pytest-mock>=3.14",
  "httpx>=0.27",
  "testcontainers>=4.8",
  "moto>=5.0",
  "locust>=2.32",
  "ruff>=0.7",
  "mypy>=1.13",
  "bandit>=1.7",
  "pip-audit>=2.7",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "C4"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
  "boto3.*",
  "botocore.*",
  "google.*",
  "azure.*",
  "qdrant_client.*",
  "rank_bm25.*",
  "yaml.*",
  "fitz.*",
  "pytesseract.*",
  "PIL.*",
  "mlflow.*",
  "datasets.*",
  "torch.*",
  "sentence_transformers.*",
  "numpy.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "unit: fast, no external services",
  "integration: requires dockerized Qdrant/MLflow",
  "e2e: full pipeline on a tiny fixture corpus",
]
addopts = "-q"

[tool.coverage.run]
source = ["src/mentera_rag"]
branch = true
