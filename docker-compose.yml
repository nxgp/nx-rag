# Complete Docker Compose Environment for Mentera RAG Stack
# Services: Qdrant Vector DB, MLflow Experiment Tracker, and Mentera RAG API Service
#
# Usage:
#   Build & start all services: make up
#   Validate configuration:    docker compose config
#   View service logs:         docker compose logs -f api

services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: mentera_qdrant
    ports:
      - "6333:6333"   # REST API + Dashboard
      - "6334:6334"   # gRPC
    volumes:
      - ./volumes/qdrant:/qdrant/storage
    stop_grace_period: 2s

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.2
    container_name: mentera_mlflow
    command: >
      mlflow server
      --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    ports:
      - "5000:5000"
    volumes:
      - ./volumes/mlflow:/mlflow
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mentera_rag_api
    env_file:
      - .env
    environment:
      - QDRANT_URL=http://qdrant:6333
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    ports:
      - "8000:8000"
    volumes:
      - /tmp/mentera_uploads:/tmp/mentera_uploads
    depends_on:
      qdrant:
        condition: service_started
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
