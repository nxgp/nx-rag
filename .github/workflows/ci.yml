name: Medical RAG Evaluation Pipeline CI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  quality-and-test-gates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest pytest-cov bandit hatchling
          pip install -e .

      - name: 1. Code Quality Gate (Ruff Linter & Formatter)
        run: |
          ruff check .
          ruff format --check .

      - name: 2. Static Type Check Gate (Mypy)
        run: |
          mypy src/

      - name: 3. Security Vulnerability Audit Gate (Bandit)
        run: |
          bandit -r src/ -x tests/

      - name: 4. Automated Unit & Integration Tests (Pytest)
        env:
          ENV: test
        run: |
          pytest --cov=src/rag_eval tests/
